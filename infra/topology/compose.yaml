services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: zenui
      POSTGRES_USER: zenui
      POSTGRES_PASSWORD: local-topology-only
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenui -d zenui"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - zenui-postgres:/var/lib/postgresql/data
  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:46379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - zenui-redis:/data
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: zenui-local
      MINIO_ROOT_PASSWORD: zenui-local-password
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - zenui-minio:/data
volumes:
  zenui-postgres:
  zenui-redis:
  zenui-minio:
